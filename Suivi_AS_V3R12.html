<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi AS V3R12</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230e5f88%22%2F%3E%3Cpath%20d%3D%22M29%207h6l2%2020%2017%2010v5l-18-5-1%2013%207%205v4l-10-3-10%203v-4l7-5-1-13-18%205v-5l17-10z%22%20fill%3D%22white%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
 --bg:#f4f7f9;--panel:#fff;--line:#d9e3ea;--text:#142632;--muted:#687985;
 --dti:#11648e;--dti2:#0a4f72;--soft:#f8fbfd;--softBlue:#edf7fb;
 --green:#2fa66d;--orange:#db8200;--blue:#4b8df8;--yellow:#d9a928;--red:#d95353;
 --danger:#c74640;--shadow:0 8px 20px rgba(15,64,90,.055)
}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:linear-gradient(#f9fbfc,#f2f6f8)}
header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--dti),var(--dti2));color:#fff;box-shadow:0 8px 22px rgba(10,75,108,.18)}
.header-inner{max-width:1380px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:21px;font-weight:800}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:9px 12px;cursor:pointer;transition:.12s;white-space:nowrap}button:hover{transform:translateY(-1px)}
.btn-primary{background:#fff;color:var(--dti2)}.btn-secondary,.btn-back{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn-soft{background:var(--softBlue);color:var(--dti2)}.btn-ghost{background:#f1f6f8;color:var(--dti2)}.btn-danger{background:#fff1f1;color:var(--danger);border:1px solid #efc8c7}
.btn-icon{height:27px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}.btn-edit{background:#eef7fb;color:var(--dti2);border:1px solid #d7e7ef;font-size:12px}.btn-delete{width:27px;padding:0;border-radius:50%;background:#fff1f1;color:var(--danger);border:1px solid #efc8c7;font-size:16px}
main{max-width:1380px;margin:14px auto;padding:0 14px 110px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.hidden{display:none!important}
/* Home */
.home-grid{width:min(1080px,100%);margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.member-card{border:1px solid #d6e2e9;border-radius:18px;padding:22px 24px;min-height:172px;background:linear-gradient(180deg,#fff,#fbfdff);cursor:pointer;transition:.16s;box-shadow:0 8px 22px rgba(15,64,90,.055)}.member-card:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(13,70,99,.10)}
.member-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.member-name{font-size:23px;font-weight:800}.member-meta{font-size:14px;line-height:1.55;color:var(--muted);margin-top:6px;white-space:pre-line}.single-dot{width:20px;height:20px;border-radius:50%;display:inline-block;box-shadow:0 0 0 5px rgba(14,94,135,.06),0 2px 7px rgba(0,0,0,.10)}.dot-blue{background:var(--blue)}.dot-green{background:var(--green)}.dot-yellow{background:var(--yellow)}.dot-red{background:var(--red)}

#homeView{
  min-height:calc(100vh - 155px);
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  box-shadow:none;
  margin-bottom:0;
  padding:28px 16px 115px;
}

/* Generalities */
.person-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.page-back{background:#eaf5fa;color:var(--dti2);border:1px solid #cfe1eb;padding:11px 17px;font-size:13px;border-radius:10px}.person-title{font-size:22px;font-weight:800;margin:0}.general-panel{padding:24px 22px 22px}.top-person{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:11px}.info-box{background:#f8fbfd;border:1px solid var(--line);border-radius:14px;padding:15px;min-height:138px}
label{display:block;margin-bottom:6px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}input,select,textarea{width:100%;border:1px solid #cedae2;border-radius:9px;padding:9px 10px;font:inherit;color:var(--text);background:#fff;font-size:13px}textarea{resize:vertical;min-height:72px}
.load-wrap{display:flex;flex-direction:column;gap:10px}.load-scale{position:relative;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}.load-line{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);height:8px;background:linear-gradient(180deg,#fff,#eaf0f4);border:1px solid #d6e0e7;border-radius:999px}.load-step{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;border:3px solid #fff;background:#d7dfe6;box-shadow:0 2px 7px rgba(0,0,0,.12);cursor:pointer}.load-step.active{transform:scale(1.30)}.load-step[data-i="0"].active{background:var(--blue)}.load-step[data-i="1"].active{background:var(--green)}.load-step[data-i="2"].active{background:var(--yellow)}.load-step[data-i="3"].active{background:var(--red)}.load-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.period-row{margin-top:11px;display:flex;justify-content:flex-end;gap:10px;align-items:end;border-top:1px solid #edf2f5;padding-top:11px}.period-field{width:180px}.period-title{margin-right:auto;font-size:12px;font-weight:800;color:var(--muted);align-self:center}
/* Activities */
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:16px
}
.section-head h2{
  margin:0;
  font-size:20px;
  letter-spacing:-.01em
}
.category-list{
  display:flex;
  flex-direction:column;
  gap:16px
}
.category{
  border:1px solid #d7e2e9;
  border-radius:16px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 5px 16px rgba(20,65,90,.045)
}
.category-head{
  display:grid;
  grid-template-columns:160px minmax(0,1.55fr) minmax(0,1fr) 118px;
  min-height:50px;
  align-items:center;
  background:linear-gradient(180deg,#f5fafc 0%,#edf5f8 100%);
  border-bottom:1px solid #d5e1e8
}
.category-head-cell{
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-right:1px solid #d9e4ea
}
.category-head-cell:last-child{
  border-right:0;
  justify-content:center;
  padding:7px
}
.category-title{
  width:100%;
  text-align:center;
  font-size:16px;
  font-weight:800;
  color:#153044;
  line-height:1.2;
  overflow-wrap:anywhere
}
.column-title{
  width:100%;
  text-align:center;
  color:#31566d;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.055em
}
.category-head .btn-soft{
  width:92px;
  height:32px;
  padding:0 10px;
  border-radius:8px;
  background:#e8f4fa;
  border:1px solid #d3e7f0;
  color:#0a5578
}
.category-body{
  padding:0;
  background:#fff
}
.subject-row{
  display:grid;
  grid-template-columns:160px minmax(0,1.55fr) minmax(0,1fr) 118px;
  min-height:92px;
  background:#fff;
  border-bottom:1px solid #e5edf2;
  transition:background .12s ease
}
.subject-row:last-child{
  border-bottom:0
}
.subject-row:hover{
  background:#fbfdfe
}
.subject-cell{
  min-width:0;
  padding:11px 12px;
  border-right:1px solid #e5edf2
}
.subject-cell:last-child{
  border-right:0
}
.subject-name-cell{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center
}
.subject-title{
  font-size:14px;
  font-weight:800;
  line-height:1.32;
  color:#183447;
  overflow-wrap:anywhere
}
.subject-edit-cell{
  display:flex;
  align-items:center;
  padding-top:8px;
  padding-bottom:8px
}
.inline-edit{
  width:100%;
  min-height:42px;
  display:flex;
  align-items:center;
  padding:7px 4px;
  border:1px solid transparent;
  border-radius:8px;
  color:#263a47;
  font-size:13px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  cursor:text;
  transition:.12s
}
.inline-edit:hover{
  background:#f8fbfd;
  border-color:#e5edf2
}
.inline-edit:focus{
  outline:none;
  background:#fff;
  border-color:#bcd7e5;
  box-shadow:0 0 0 3px rgba(14,95,136,.07)
}
.inline-edit:empty::before{
  content:"—";
  color:#a0acb4;
  pointer-events:none
}
.action-cell{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px;
  background:#fbfdfe
}
.action-cell .btn-edit,
.action-cell .btn-delete-text{
  width:96px;
  height:29px;
  padding:0 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:800
}
.action-cell .btn-edit{
  border:1px solid #d3e4ed;
  background:#edf7fb;
  color:#0b587c
}
.action-cell .btn-delete-text{
  border:1px solid #f0cecb;
  background:#fff5f4;
  color:#c94842
}
.principal-control{
  width:96px;
  min-height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:4px 6px;
  border:1px solid #e0e7eb;
  border-radius:8px;
  background:#fff;
  color:#687983;
  font-size:10px;
  font-weight:800
}
.principal-control.active{
  background:#fff7ec;
  border-color:#efcc9c;
  color:#975700
}
.mini-switch{
  position:relative;
  width:31px;
  height:18px;
  flex:0 0 auto
}
.mini-switch input{
  opacity:0;
  width:0;
  height:0
}
.mini-slider{
  position:absolute;
  inset:0;
  border-radius:999px;
  background:#d9e2e7;
  cursor:pointer;
  transition:.15s
}
.mini-slider::before{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  left:2px;
  top:2px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
  transition:.15s
}
.mini-switch input:checked + .mini-slider{
  background:#d97706
}
.mini-switch input:checked + .mini-slider::before{
  transform:translateX(13px)
}
.no-activities{
  padding:28px 18px;
  text-align:center;
  color:#82909a;
  font-size:13px;
  background:#fbfdfe;
  border:1px dashed #d7e2e9;
  border-radius:13px
}

@media(max-width:980px){
  .category-head,
  .subject-row{
    grid-template-columns:145px minmax(0,1.4fr) minmax(0,1fr) 112px
  }
}
@media(max-width:760px){
  .category-head{
    display:grid;
    grid-template-columns:1fr auto;
  }
  .category-head-cell{
    border-right:0
  }
  .category-head-cell:nth-child(2),
  .category-head-cell:nth-child(3){
    display:none
  }
  .category-title{
    text-align:left
  }
  .subject-row{
    display:block;
    min-height:0;
    padding:2px 0
  }
  .subject-cell{
    border-right:0;
    border-bottom:1px solid #edf2f5;
    padding:10px 12px
  }
  .subject-name-cell{
    justify-content:flex-start;
    text-align:left
  }
  .subject-edit-cell{
    display:block
  }
  .subject-cell:nth-child(2)::before,
  .subject-cell:nth-child(3)::before{
    display:block;
    margin-bottom:5px;
    color:#6f808b;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.055em;
    font-weight:800
  }
  .subject-cell:nth-child(2)::before{content:"Fait"}
  .subject-cell:nth-child(3)::before{content:"À venir"}
  .action-cell{
    border-bottom:0;
    background:#fff
  }
}

/* Modals */
.modal-mask{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(15,35,48,.36);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.modal{
  width:min(940px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 22px 48px rgba(15,35,48,.25)
}
.modal-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:16px
}
.subject-form-top{
  display:grid;
  grid-template-columns:minmax(190px,.65fr) minmax(320px,1.55fr) 170px;
  gap:12px;
  align-items:end
}
.subject-form-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:12px
}
.subject-form-body textarea{
  min-height:200px;
  line-height:1.45
}
.subject-form-custom{
  margin-top:12px
}
.modal-principal{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:7px 10px;
  border:1px solid #dfe7eb;
  border-radius:10px;
  background:#f8fbfd;
  color:#526773;
  font-size:12px;
  font-weight:800
}
.modal-principal.active{
  background:#fff7ec;
  border-color:#efcc9c;
  color:#975700
}
.modal-principal .switch{
  width:42px;
  height:24px
}
.modal-principal .slider:before{
  width:18px;
  height:18px
}
.modal-principal .switch input:checked + .slider:before{
  transform:translateX(18px)
}
.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px
}
.switch{
  position:relative;
  width:46px;
  height:26px;
  flex:0 0 auto
}
.switch input{
  display:none
}
.slider{
  position:absolute;
  inset:0;
  background:#d9e1e6;
  border-radius:999px;
  transition:.18s;
  cursor:pointer
}
.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  transition:.18s
}
.switch input:checked + .slider{
  background:var(--orange)
}
.switch input:checked + .slider:before{
  transform:translateX(20px)
}
@media(max-width:760px){
  .subject-form-top,
  .subject-form-body{
    grid-template-columns:1fr
  }
}

.sync-tools{
  display:flex;
  align-items:center;
  gap:9px
}
.sync-status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:0 11px;
  border:1px solid #d8e4ea;
  border-radius:999px;
  background:#f8fbfd;
  color:#5e717d;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}
.sync-status::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:#9aa9b2
}
.sync-status.loading::before{background:#d9a928}
.sync-status.saving::before{background:#d97706}
.sync-status.saved::before{background:#2fa66d}
.sync-status.readonly::before{background:#4b8df8}
.sync-status.error::before{background:#d95353}

.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:28;background:linear-gradient(180deg,#ffffff,#f5fafc);border-top:1px solid #cbdbe4;box-shadow:0 -10px 26px rgba(15,64,90,.10);backdrop-filter:blur(8px)}.bottom-inner{max-width:1380px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:22px}.validity{display:flex;align-items:center;gap:12px;background:#f8fbfd;border:1px solid #d9e5ec;border-radius:13px;padding:9px 12px}.validity-title{font-size:14px;font-weight:800;color:var(--dti2);margin-right:6px;white-space:nowrap}.validity-field{width:165px}.validity-field label{margin-bottom:3px}.validity-field input{padding:8px 10px;background:#fff}.bottom-actions{display:flex;align-items:center;gap:10px}.btn-report{background:var(--dti);color:#fff;padding:10px 16px} .btn-report:hover{background:var(--dti2)}
.btn-csv{background:#e5f3ed;color:#146447;border:1px solid #bedfcf;padding:10px 16px}
.btn-csv:hover{background:#d1eadd}
.bottom-actions{flex-wrap:wrap;justify-content:flex-end}

@media(max-width:760px){
  .category-table-head{display:none}
  .subject-row{grid-template-columns:1fr}
  .subject-cell{border-right:0;border-bottom:1px solid #edf2f5}
  .subject-cell:last-child{border-bottom:0}
  .subject-cell:nth-child(2)::before{content:"Fait";display:block;margin-bottom:5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
  .subject-cell:nth-child(3)::before{content:"À venir";display:block;margin-bottom:5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
}

@media(max-width:760px){
  .action-cell{
    justify-content:flex-end;
    border-top:0
  }
  .subject-cell:nth-child(4)::before{content:""}
}
@media(max-width:1100px){.top-person{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){#homeView{min-height:auto;padding-top:26px}.home-grid{grid-template-columns:1fr}}@media(max-width:760px){.top-person,.subject-fields,.modal-grid{grid-template-columns:1fr}.modal-grid .full{grid-column:auto}.bottom-inner{align-items:stretch;flex-direction:column}.validity{width:100%;flex-wrap:wrap}.validity-title{width:100%;padding-bottom:0}.validity-field{flex:1;min-width:140px}.bottom-actions{width:100%;justify-content:flex-end}}

/* Accès GitHub personnel : saisie locale, sans secret dans le dépôt */
.github-token-panel{max-width:1380px;margin:0 auto;padding:0 18px 14px}
.github-token-panel form{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 14px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(0,0,0,.12)}
.github-token-panel label{margin:0 5px 0 0;color:#fff;font-weight:750;font-size:13px;letter-spacing:0;text-transform:none}
.github-token-panel input{width:min(310px,100%);min-width:200px;flex:1 1 220px;border:1px solid #cdd8df;border-radius:8px;background:#fff;color:#263643;padding:10px 11px;font-size:13px}
.github-token-panel button{padding:10px 12px;border-radius:8px;font-size:12px;min-height:38px}
.github-token-save{background:#fff;color:var(--dti2)}
.github-token-secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
#githubTokenFeedback{font-size:12px;color:rgba(255,255,255,.89);flex-basis:100%}
@media(max-width:600px){.github-token-panel form{align-items:stretch;flex-direction:column}.github-token-panel label,.github-token-panel input,.github-token-panel button{width:100%;min-width:0;flex:auto}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand"><h1>Suivi des activités Air-Sol</h1></div><div class="top-actions sync-tools"><a href="./Suivi_C_V1R3.html" style="color:white;margin-right:14px">Suivi C</a><button id="githubAccessButton" class="btn-secondary" onclick="configureGitHubAccess()" title="Configurer votre accès GitHub personnel pour enregistrer les modifications">Accès GitHub</button><span id="syncStatus" class="sync-status loading">Chargement…</span></div></div><div id="githubTokenPanel" class="github-token-panel hidden" role="region" aria-label="Accès GitHub">
  <form id="githubTokenForm" onsubmit="saveGitHubToken(event)">
    <label for="githubTokenInput">Jeton GitHub personnel</label>
    <input type="password" id="githubTokenInput" autocomplete="off" spellcheck="false" placeholder="github_pat_…" required aria-label="Jeton GitHub" />
    <button id="githubTokenSave" type="submit" class="github-token-save">Enregistrer</button>
    <button type="button" class="github-token-secondary" onclick="forgetGitHubToken()">Supprimer l’accès</button>
    <button type="button" class="github-token-secondary" onclick="toggleGitHubTokenPanel(false)">Fermer</button>
    <span id="githubTokenFeedback" role="status" aria-live="polite">Le jeton restera dans ce navigateur, et non dans le dépôt GitHub.</span>
  </form>
</div></header>
<main>
<section id="homeView" class="panel"><div id="homeGrid" class="home-grid"></div></section>
<section id="personView" class="hidden">
 <div class="panel general-panel"><div class="person-heading"><h2 id="personTitle" class="person-title"></h2><button class="page-back" onclick="goHome()">← Retour équipe</button></div><div id="topPerson" class="top-person"></div></div>
 <div class="panel" style="padding:18px"><div class="section-head"><h2>Activités</h2><button class="btn-soft" onclick="openAddActivityModal()">Ajouter une activité</button></div><div id="categoriesArea" class="category-list"></div></div>
</section>
</main>
<div class="bottom-bar"><div class="bottom-inner"><div class="validity"><div class="validity-title">Suivi des activités</div><div class="validity-field"><label>Du</label><input id="globalPeriodStart" type="date" onchange="savePeriod('start',this.value)"></div><div class="validity-field"><label>Au</label><input id="globalPeriodEnd" type="date" onchange="savePeriod('end',this.value)"></div></div><div class="bottom-actions"><button class="btn-csv" onclick="downloadReportXLSX()">Exporter Excel</button><button class="btn-report" onclick="downloadReportPDF()">Exporter le rapport</button></div></div></div>
<div id="modalRoot"></div>
<script>
const DEFAULT_STATE={"members":[{"id":"menouer","name":"Menouer ZAOUI","load":1,"travel":"","leave":"","remark":"","activities":[]},{"id":"noelle","name":"Noëlle FOUCONNIER","load":1,"travel":"","leave":"","remark":"","activities":[]},{"id":"vincent","name":"Vincent MONTI","load":1,"travel":"","leave":"","remark":"","activities":[]},{"id":"armand","name":"Armand JULIEN","load":1,"travel":"","leave":"","remark":"","activities":[]}],"reportPeriod":{"start":"","end":""}};
const FIXED_CATEGORIES=["Couverture radio", "Intermodulation", "FFT", "EB", "MCO Pylône", "Activité Labo", "AAV", "Chargeur ELTEK", "Prérequis CATIA", "FUR", "FH", "Formation", "Autre"];

const GITHUB_OWNER='Armand3125';
const GITHUB_REPO='suivi-onx';
const GITHUB_BRANCH='main';
const MEMBER_IDS=['menouer','noelle','vincent','armand'];
const MEMBER_FILES={menouer:'Data-AS/menouer.json',noelle:'Data-AS/noelle.json',vincent:'Data-AS/vincent.json',armand:'Data-AS/armand.json'};
const PERIOD_FILE='Data-AS/report-period.json';
const CANONICAL_NAMES={menouer:'Menouer ZAOUI',noelle:'Noëlle FOUCONNIER',vincent:'Vincent MONTI',armand:'Armand JULIEN'};
// Autorisation locale propre à ce navigateur : le jeton n'est jamais publié sur GitHub.
const GITHUB_TOKEN_STORAGE='suivi-onx:github:token';
let githubToken='';
try{githubToken=localStorage.getItem(GITHUB_TOKEN_STORAGE)||''}catch(e){}

const SAVE_DELAY=1200;

function ensureCoreMembers(s){
  const core=[
    {id:'menouer',name:'Menouer ZAOUI'},
    {id:'noelle',name:'Noëlle FOUCONNIER'},
    {id:'vincent',name:'Vincent MONTI'},
    {id:'armand',name:'Armand JULIEN'}
  ];
  for(const c of core){
    if(!s.members.some(m=>m.id===c.id||m.name===c.name)){
      s.members.push({id:c.id,name:c.name,load:1,travel:'',leave:'',remark:'',activities:[]});
    }
  }
  const order=['menouer','noelle','vincent','armand'];
  s.members.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  return s
}

let state=normalizeImported(structuredClone(DEFAULT_STATE)),
    currentMemberId=null,
    undoStacks={},
    inlineOriginal={},
    remoteReady=false,
    saveTimers={},
    savingMembers=new Set(),
    dirtyMembers=new Set(),
    remoteSnapshots={},
    refreshInProgress=false,
    periodSnapshot='',
    periodSaveTimer=null,
    periodSaving=false,
    dirtyPeriodFields=new Set();
const maxUndo=100;

function normalizePeriod(p){
  return {
    start:p&&typeof p.start==='string'?p.start:'',
    end:p&&typeof p.end==='string'?p.end:''
  }
}
function periodPayload(p=state.reportPeriod){return JSON.stringify(normalizePeriod(p),null,2)}
function normalizeMember(m,i=0){
  return {
    id:m.id||MEMBER_IDS[i]||uid(),
    name:CANONICAL_NAMES[m.id]||m.name||('Membre '+(i+1)),
    load:Number.isInteger(m.load)?Math.max(0,Math.min(3,m.load)):1,
    travel:m.travel||'',
    leave:m.leave||'',
    remark:m.remark||'',
    activities:Array.isArray(m.activities)?m.activities.map(a=>({
      id:a.id||uid(),
      category:a.category||'AAV',
      customCategory:a.customCategory||'',
      title:a.title||'',
      done:a.done||'',
      future:a.future||'',
      effort:a.effort==='heavy'?'heavy':'light'
    })).filter(a=>(a.title||'').trim()):[]
  }
}
function normalizeImported(p){
  return {
    reportPeriod:normalizePeriod(p&&p.reportPeriod),
    members:(p&&Array.isArray(p.members)?p.members:[]).map(normalizeMember)
  }
}
function memberPayload(m){
  return JSON.stringify(normalizeMember(m),null,2)
}
function apiUrl(id){
  return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MEMBER_FILES[id]}`
}
function periodApiUrl(){
  return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PERIOD_FILE}`
}
function getToken(){return githubToken}
function updateGitHubAccessUI(){
  const btn=document.getElementById('githubAccessButton');
  if(!btn)return;
  const configured=!!getToken();
  btn.textContent=configured?'Écriture automatique':'Configurer l’écriture';
  btn.title=configured?'Jeton enregistré dans ce navigateur. Cliquer pour le remplacer ou le supprimer.':'Renseigner votre jeton GitHub une seule fois sur cet appareil.';
}
function toggleGitHubTokenPanel(force){
  const panel=document.getElementById('githubTokenPanel');
  if(!panel)return;
  const show=typeof force==='boolean'?force:panel.classList.contains('hidden');
  panel.classList.toggle('hidden',!show);
  if(show){
    const input=document.getElementById('githubTokenInput');
    if(input)input.focus();
  }
}
function configureGitHubAccess(){
  toggleGitHubTokenPanel();
  return false;
}
function requireGitHubAccess(){
  if(getToken())return true;
  toggleGitHubTokenPanel(true);
  return false;
}
async function saveGitHubToken(event){
  if(event)event.preventDefault();
  const input=document.getElementById('githubTokenInput');
  const feedback=document.getElementById('githubTokenFeedback');
  const submit=document.getElementById('githubTokenSave');
  const token=(input?.value||'').trim();
  if(!token){if(feedback)feedback.textContent='Saisissez votre jeton GitHub.';return false;}
  if(submit)submit.disabled=true;
  if(feedback)feedback.textContent='Vérification du jeton…';
  try{
    const headers={
      'Accept':'application/vnd.github+json',
      'Authorization':'Bearer '+token,
      'X-GitHub-Api-Version':'2022-11-28'
    };
    const response=await fetch(apiUrl(MEMBER_IDS[0])+'?ref='+encodeURIComponent(GITHUB_BRANCH),{headers,cache:'no-store'});
    if(!response.ok)throw new Error('GitHub : HTTP '+response.status+' (jeton ou droits à vérifier)');
    let saved=true;
    try{localStorage.setItem(GITHUB_TOKEN_STORAGE,token);}catch(e){saved=false;}
    githubToken=token;
    input.value='';
    updateGitHubAccessUI();
    toggleGitHubTokenPanel(false);
    if(remoteReady){
      for(const id of [...dirtyMembers])scheduleMemberSave(id,50);
      if(dirtyPeriodFields.size)schedulePeriodSave(50);
      else if(!dirtyMembers.size)setSyncStatus('saved',saved?'Écriture automatique active':'Écriture active pour cette session');
    }else await initRemote();
    return true;
  }catch(e){
    if(feedback)feedback.textContent='Échec de vérification : '+(e?.message||String(e));
    return false;
  }finally{
    if(submit)submit.disabled=false;
  }
}
function forgetGitHubToken(){
  if((dirtyMembers.size||dirtyPeriodFields.size)&&!confirm('Des changements ne sont pas encore enregistrés. Désactiver l’accès GitHub ?'))return;
  githubToken='';
  try{localStorage.removeItem(GITHUB_TOKEN_STORAGE);}catch(e){}
  const input=document.getElementById('githubTokenInput');
  if(input)input.value='';
  updateGitHubAccessUI();
  const feedback=document.getElementById('githubTokenFeedback');
  if(feedback)feedback.textContent='Jeton supprimé de ce navigateur. Mode lecture seule.';
  setSyncStatus('error','Lecture seule');
}
function setSyncStatus(kind,label){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.className='sync-status '+kind;
  el.textContent=label
}
function base64ToUtf8(b64){
  const clean=String(b64||'').replace(/\s/g,'');
  const bin=atob(clean);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes)
}
async function fetchRemoteMember(id){
  const token=getToken();
  if(!token){
    const path=MEMBER_FILES[id];
    const url='https://raw.githubusercontent.com/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/'+GITHUB_BRANCH+'/'+path+'?t='+Date.now();
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error(id+': HTTP '+r.status);
    const parsed=await r.json();
    if(parsed.id!==id)throw new Error('Identifiant incohérent : '+id);
    return normalizeMember(parsed,MEMBER_IDS.indexOf(id))
  }
  const headers={
    'Accept':'application/vnd.github+json',
    'Authorization':`Bearer ${token}`,
    'X-GitHub-Api-Version':'2022-11-28'
  };

  const r=await fetch(`${apiUrl(id)}?ref=${encodeURIComponent(GITHUB_BRANCH)}&t=${Date.now()}`,{
    headers,
    cache:'no-store'
  });

  if(!r.ok)throw new Error(`${id}: HTTP ${r.status}`);

  const info=await r.json();
  if(!info.content)throw new Error(`${id}: contenu GitHub absent`);

  const parsed=JSON.parse(base64ToUtf8(info.content));
  if(parsed.id!==id)throw new Error('Identifiant incohérent : '+id);
  return normalizeMember(parsed,MEMBER_IDS.indexOf(id))
}
async function fetchRemotePeriod(){
  if(!getToken()){
    const url='https://raw.githubusercontent.com/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/'+GITHUB_BRANCH+'/'+PERIOD_FILE+'?t='+Date.now();
    const r=await fetch(url,{cache:'no-store'});
    if(r.status===404)return normalizePeriod(null);
    if(!r.ok)throw new Error('dates: HTTP '+r.status);
    return normalizePeriod(await r.json())
  }
  const headers={
    'Accept':'application/vnd.github+json',
    'Authorization':`Bearer ${getToken()}`,
    'X-GitHub-Api-Version':'2022-11-28'
  };
  const r=await fetch(`${periodApiUrl()}?ref=${encodeURIComponent(GITHUB_BRANCH)}&t=${Date.now()}`,{
    headers,
    cache:'no-store'
  });
  if(r.status===404)return normalizePeriod(null);
  if(!r.ok)throw new Error(`dates: HTTP ${r.status}`);
  const info=await r.json();
  if(!info.content)throw new Error('dates: contenu GitHub absent');
  return normalizePeriod(JSON.parse(base64ToUtf8(info.content)))
}
async function initRemote(){
  setSyncStatus('loading','Chargement…');
  const [results,periodResult]=await Promise.all([
    Promise.allSettled(MEMBER_IDS.map(fetchRemoteMember)),
    fetchRemotePeriod().then(value=>({status:'fulfilled',value}),reason=>({status:'rejected',reason}))
  ]);
  const members=[];
  const failed=[];

  results.forEach((res,i)=>{
    const id=MEMBER_IDS[i];
    if(res.status==='fulfilled'){
      members.push(res.value);
      remoteSnapshots[id]=memberPayload(res.value)
    }else{
      failed.push(id);
      const fallback=normalizeMember(DEFAULT_STATE.members.find(m=>m.id===id),i);
      members.push(fallback);
      remoteSnapshots[id]=memberPayload(fallback)
    }
  });

  const reportPeriod=periodResult.status==='fulfilled'?periodResult.value:normalizePeriod(null);
  if(periodResult.status==='rejected')failed.push('dates');
  periodSnapshot=periodPayload(reportPeriod);
  state=ensureCoreMembers({reportPeriod,members});
  remoteReady=true;
  render();

  if(failed.length){
    setSyncStatus('error','Erreur de chargement GitHub')
  }else{
    setSyncStatus('saved',getToken()?'Synchronisé':'Synchronisé · lecture seule')
  }

  // Recharge les modifications distantes toutes les minutes.
  setInterval(refreshRemoteMembers,60000)
}
function isCurrentMemberBeingEdited(){
  if(!currentMemberId)return false;
  if(document.querySelector('#modalRoot .modal-mask'))return true;
  const active=document.activeElement;
  return !!(active&&(
    active.isContentEditable||
    active.tagName==='INPUT'||
    active.tagName==='TEXTAREA'||
    active.tagName==='SELECT'
  ))
}
function isPeriodBeingEdited(){
  const active=document.activeElement;
  return !!(active&&(active.id==='globalPeriodStart'||active.id==='globalPeriodEnd'))
}
async function refreshRemoteMembers(){
  if(!remoteReady||refreshInProgress)return;
  refreshInProgress=true;
  const protectedMemberId=isCurrentMemberBeingEdited()?currentMemberId:null;
  const ids=MEMBER_IDS.filter(id=>id!==protectedMemberId&&!dirtyMembers.has(id)&&!savingMembers.has(id));
  const refreshPeriod=!dirtyPeriodFields.size&&!periodSaving&&!isPeriodBeingEdited();
  if(!ids.length&&!refreshPeriod){refreshInProgress=false;return}
  let changed=false,currentChanged=false,periodChanged=false;

  try{
    await Promise.all([
      ...ids.map(async id=>{
        try{
          const fresh=await fetchRemoteMember(id);

          // Une saisie locale peut avoir commencé pendant le chargement réseau.
          if(dirtyMembers.has(id)||savingMembers.has(id)||(id===currentMemberId&&isCurrentMemberBeingEdited()))return;

          const payload=memberPayload(fresh);
          if(payload!==remoteSnapshots[id]){
            const idx=state.members.findIndex(m=>m.id===id);
            if(idx>=0)state.members[idx]=fresh;
            remoteSnapshots[id]=payload;
            undoStacks[id]=[];
            changed=true;
            if(id===currentMemberId)currentChanged=true
          }
        }catch(e){}
      }),
      refreshPeriod?(async()=>{
        try{
          const fresh=await fetchRemotePeriod();
          if(dirtyPeriodFields.size||periodSaving||isPeriodBeingEdited())return;
          const payload=periodPayload(fresh);
          if(payload!==periodSnapshot){
            state.reportPeriod=fresh;
            periodSnapshot=payload;
            periodChanged=true
          }
        }catch(e){}
      })():Promise.resolve()
    ])
  }finally{
    refreshInProgress=false
  }

  if(periodChanged)syncReportPeriod();
  if(currentChanged&&currentMemberId)renderPerson();
  else if(changed&&!currentMemberId)renderHome()
}
function scheduleMemberSave(id,delay=SAVE_DELAY){
  if(!remoteReady||!id)return;
  dirtyMembers.add(id);
  if(!requireGitHubAccess()){setSyncStatus('error','Écriture non configurée · modifications en attente');return}
  clearTimeout(saveTimers[id]);

  setSyncStatus('saving','Modifications…');
  saveTimers[id]=setTimeout(()=>saveMemberRemote(id),delay)
}
async function saveMemberRemote(id){
  clearTimeout(saveTimers[id]);
  if(savingMembers.has(id)){
    scheduleMemberSave(id,400);
    return
  }
  const token=getToken();
  if(!requireGitHubAccess()){setSyncStatus('error','Écriture non configurée · modifications en attente');return}

  const member=state.members.find(m=>m.id===id);
  if(!member)return;
  const payload=memberPayload(member);

  if(payload===remoteSnapshots[id]){
    dirtyMembers.delete(id);
    if(!dirtyMembers.size&&!dirtyPeriodFields.size&&!periodSaving)setSyncStatus('saved','Synchronisé');
    return
  }

  savingMembers.add(id);
  setSyncStatus('saving','Enregistrement…');

  try{
    const headers={
      'Accept':'application/vnd.github+json',
      'Authorization':`Bearer ${token}`,
      'X-GitHub-Api-Version':'2022-11-28'
    };

    // Always read the latest SHA just before writing.
    const meta=await fetch(`${apiUrl(id)}?ref=${encodeURIComponent(GITHUB_BRANCH)}`,{
      headers,
      cache:'no-store'
    });
    if(!meta.ok)throw new Error(`Lecture GitHub: ${meta.status}`);
    const info=await meta.json();

    const body={
      message:`Mise à jour ${member.name}`,
      content:utf8ToBase64(payload),
      sha:info.sha,
      branch:GITHUB_BRANCH
    };

    const r=await fetch(apiUrl(id),{
      method:'PUT',
      headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });

    if(r.status===409){
      throw new Error('Conflit de version')
    }
    if(!r.ok){
      throw new Error(`Écriture GitHub: ${r.status}`)
    }

    remoteSnapshots[id]=payload;
    if(memberPayload(state.members.find(m=>m.id===id))===payload){
      dirtyMembers.delete(id)
    }

    setSyncStatus(
      dirtyMembers.size||dirtyPeriodFields.size||periodSaving?'saving':'saved',
      dirtyMembers.size||dirtyPeriodFields.size||periodSaving?'Modifications…':'Enregistré'
    )
  }catch(e){
    console.error(e);
    setSyncStatus('error',e.message.includes('Conflit')?'Conflit — réessayer':'Erreur d’enregistrement')
  }finally{
    savingMembers.delete(id);
    if(dirtyMembers.has(id)&&memberPayload(state.members.find(m=>m.id===id))!==remoteSnapshots[id]){
      scheduleMemberSave(id,700)
    }
  }
}
function schedulePeriodSave(delay=SAVE_DELAY){
  if(!remoteReady||!dirtyPeriodFields.size)return;
  if(!requireGitHubAccess()){setSyncStatus('error','Écriture non configurée · modifications en attente');return}
  clearTimeout(periodSaveTimer);
  setSyncStatus('saving','Modifications…');
  periodSaveTimer=setTimeout(savePeriodRemote,delay)
}
async function savePeriodRemote(){
  if(!requireGitHubAccess()){setSyncStatus('error','Écriture non configurée · modifications en attente');return}
  clearTimeout(periodSaveTimer);
  if(periodSaving){
    schedulePeriodSave(400);
    return
  }
  const fields=[...dirtyPeriodFields];
  if(!fields.length)return;
  const changes={};
  fields.forEach(k=>changes[k]=state.reportPeriod[k]||'');
  periodSaving=true;
  setSyncStatus('saving','Enregistrement…');

  try{
    const headers={
      'Accept':'application/vnd.github+json',
      'Authorization':`Bearer ${getToken()}`,
      'X-GitHub-Api-Version':'2022-11-28'
    };
    const meta=await fetch(`${periodApiUrl()}?ref=${encodeURIComponent(GITHUB_BRANCH)}&t=${Date.now()}`,{
      headers,
      cache:'no-store'
    });
    if(!meta.ok&&meta.status!==404)throw new Error(`Lecture GitHub: ${meta.status}`);

    let info=null,remote=normalizePeriod(null);
    if(meta.ok){
      info=await meta.json();
      if(info.content)remote=normalizePeriod(JSON.parse(base64ToUtf8(info.content)))
    }
    const merged={...remote,...changes};
    const payload=periodPayload(merged);
    const body={
      message:'Mise à jour de la période de suivi',
      content:utf8ToBase64(payload),
      branch:GITHUB_BRANCH
    };
    if(info&&info.sha)body.sha=info.sha;

    const r=await fetch(periodApiUrl(),{
      method:'PUT',
      headers:{...headers,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(r.status===409)throw new Error('Conflit de version');
    if(!r.ok)throw new Error(`Écriture GitHub: ${r.status}`);

    periodSnapshot=payload;
    for(const k of ['start','end']){
      if(fields.includes(k)&&state.reportPeriod[k]===changes[k]){
        dirtyPeriodFields.delete(k);
        state.reportPeriod[k]=merged[k]
      }else if(!dirtyPeriodFields.has(k)){
        state.reportPeriod[k]=merged[k]
      }
    }
    syncReportPeriod();
    setSyncStatus(
      dirtyMembers.size||dirtyPeriodFields.size||savingMembers.size?'saving':'saved',
      dirtyMembers.size||dirtyPeriodFields.size||savingMembers.size?'Modifications…':'Enregistré'
    )
  }catch(e){
    console.error(e);
    setSyncStatus('error',e.message.includes('Conflit')?'Conflit — réessayer':'Erreur d’enregistrement')
  }finally{
    periodSaving=false;
    if(dirtyPeriodFields.size)schedulePeriodSave(700)
  }
}
function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin+=String.fromCharCode(...bytes.subarray(i,i+chunk))
  }
  return btoa(bin)
}
function persist(){
  if(!remoteReady)return;
  for(const m of state.members){
    const payload=memberPayload(m);
    if(payload!==remoteSnapshots[m.id])scheduleMemberSave(m.id)
  }
}
function pushHistory(){
  const member=getCurrentMember();
  if(!member)return;
  const stack=undoStacks[member.id]||(undoStacks[member.id]=[]);
  stack.push(JSON.stringify(member));
  if(stack.length>maxUndo)stack.shift()
}
function undoAction(){
  const member=getCurrentMember();
  if(!member)return;
  const stack=undoStacks[member.id];
  if(!stack||!stack.length)return;
  const previous=normalizeMember(JSON.parse(stack.pop()),MEMBER_IDS.indexOf(member.id));
  const idx=state.members.findIndex(m=>m.id===member.id);
  if(idx<0)return;
  state.members[idx]=previous;
  persist();
  closeModal();
  render()
}
document.addEventListener('keydown',e=>{
  const active=document.activeElement;
  const editing=active&&(active.isContentEditable||active.tagName==='INPUT'||active.tagName==='TEXTAREA');
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!editing){
    e.preventDefault();
    undoAction()
  }
})
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function nl(s=''){return esc(s).replace(/\n/g,'<br>')}function escJS(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function uid(){return'id_'+Math.random().toString(36).slice(2,10)}function getCurrentMember(){return state.members.find(m=>m.id===currentMemberId)||null}function getLoadDotClass(v){return['dot-blue','dot-green','dot-yellow','dot-red'][v]||'dot-green'}function displayCategory(a){return a.category==='Autre'?((a.customCategory||'').trim()||'Autre'):a.category}
function syncReportPeriod(){const s=document.getElementById('globalPeriodStart'),e=document.getElementById('globalPeriodEnd');if(s)s.value=state.reportPeriod.start||'';if(e)e.value=state.reportPeriod.end||''}function render(){syncReportPeriod();if(currentMemberId){document.getElementById('homeView').classList.add('hidden');document.getElementById('personView').classList.remove('hidden');renderPerson()}else{document.getElementById('personView').classList.add('hidden');document.getElementById('homeView').classList.remove('hidden');renderHome()}}
function renderHome(){const el=document.getElementById('homeGrid');el.innerHTML='';state.members.forEach(m=>{const c=document.createElement('div');c.className='member-card';c.onclick=()=>{currentMemberId=m.id;render()};c.innerHTML=`<div class="member-top"><div class="member-name">${esc(m.name)}</div><span class="single-dot ${getLoadDotClass(m.load)}"></span></div><div class="member-meta"><b>Déplacements :</b> ${esc(m.travel||'—')}</div><div class="member-meta"><b>Congés :</b> ${esc(m.leave||'—')}</div><div class="member-meta"><b>Remarque :</b> ${esc(m.remark||'—')}</div>`;el.appendChild(c)})}function goHome(){currentMemberId=null;closeModal();render()}

  const clean=String(v||'').replace(/\u00a0/g,' ').trim();
  const k=id+'|'+f;

/* PDF writer - standalone, no external library */
function cp1252Byte(ch){const c=ch.codePointAt(0);if(c<=255)return c;const map={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};return map[ch]??63}
function pdfText(s){s=String(s??'').replace(/\u00a0/g,' ').replace(/[\r\n]+/g,' ');let o='';for(const ch of s){let b=cp1252Byte(ch);if(b===40||b===41||b===92)o+='\\'+String.fromCharCode(b);else if(b<32||b>126)o+='\\'+b.toString(8).padStart(3,'0');else o+=String.fromCharCode(b)}return o}
function rgbCmd(hex,stroke=false){const h=hex.replace('#',''),r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;return`${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} ${stroke?'RG':'rg'}`}
function makeReportPdf(){
const W=595.28,H=841.89,M=34,usable=W-2*M;
let pages=[],p=null,y=0,overflowHandler=null;

function newPage(key=null){
  p={c:[],a:[],key};
  pages.push(p);
  y=78;
}
function cmd(s){p.c.push(s)}
function rect(x,top,w,h,fill,stroke){
  const yy=H-top-h;
  cmd('q');
  if(fill)cmd(rgbCmd(fill));
  if(stroke)cmd(rgbCmd(stroke,true));
  cmd(`${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill&&stroke?'B':fill?'f':'S'}`);
  cmd('Q')
}
function text(x,top,s,size=9,bold=false,color='#20313c'){
  cmd(`BT /${bold?'F2':'F1'} ${size} Tf ${rgbCmd(color)} ${x.toFixed(2)} ${(H-top-size).toFixed(2)} Td (${pdfText(s)}) Tj ET`)
}
function wrap(s,size,maxW){
  const raw=String(s??'').split(/\n/),max=Math.max(5,Math.floor(maxW/(size*.50))),out=[];
  for(const para of raw){
    const words=para.split(/\s+/).filter(Boolean);
    if(!words.length){out.push('');continue}
    let l='';
    for(const w of words){
      const test=l?l+' '+w:w;
      if(test.length<=max)l=test;
      else{
        if(l)out.push(l);
        if(w.length>max){
          let q=w;
          while(q.length>max){out.push(q.slice(0,max));q=q.slice(max)}
          l=q
        }else l=w
      }
    }
    if(l)out.push(l)
  }
  return out
}
function drawLines(x,top,lines,size,color,bold=false,lh=10.4){
  lines.forEach((l,i)=>text(x,top+i*lh,l,size,bold,color))
}
function reportHeader(){
  rect(0,0,W,62,'#0e5f88',null);
  text(M,14,'Suivi des activités Air-Sol',17,true,'#ffffff');
  const ps=formatDateFR(state.reportPeriod.start)||'—',pe=formatDateFR(state.reportPeriod.end)||'—';
  text(M,37,`Période du ${ps} au ${pe}`,9.5,false,'#dceef7');
  y=78
}
function ensure(h){
  if(y+h>H-43){
    if(overflowHandler)overflowHandler();
    else{
      newPage();
      reportHeader()
    }
  }
}
function addLink(x,top,w,h,targetKey){
  p.a.push({
    rect:[x,H-(top+h),x+w,H-top],
    targetKey
  })
}
function row(cells,widths,head=false,principal=false,linkKey=null,cellColors=null){
  const size=head?8:8.1,lh=10.4,pad=5;
  const lines=cells.map((c,i)=>wrap(c,size,widths[i]-2*pad));
  const rh=Math.max(22,...lines.map(ls=>ls.length*lh+2*pad));
  ensure(rh+1);
  const rowTop=y;
  let x=M;
  for(let i=0;i<cells.length;i++){
    rect(x,y,widths[i],rh,head?'#eef5f8':'#ffffff','#d4dde3');
    let color=head?'#0a4f72':'#263743';
    let bold=head||(i===0);
    if(i===0&&principal)color='#d97706';
    if(i===0&&linkKey){color='#0e5f88';bold=true}
    if(cellColors&&cellColors[i]){color=cellColors[i];bold=true}
    drawLines(x+pad,y+pad,lines[i],size,color,bold,lh);
    x+=widths[i]
  }
  if(linkKey)addLink(M,rowTop,widths[0],rh,linkKey);
  y+=rh
}
function activitySeparator(title){
  const widths=[125,242,160];
  const h=24;
  ensure(h+1);

  let x=M;
  const cells=[title,'Fait','À venir'];

  for(let i=0;i<3;i++){
    rect(x,y,widths[i],h,'#eef6fa','#cfdee6');

    if(i===0){
      const lines=wrap(cells[i],9.6,widths[i]-12);
      drawLines(x+6,y+6,lines,9.6,'#0a4f72',true,10.4)
    }else{
      const label=cells[i].toUpperCase();
      const approx=label.length*4.7;
      text(x+(widths[i]-approx)/2,y+7,label,8,true,'#31566d')
    }

    x+=widths[i]
  }

  y+=h
}
function polygon(points,fill,stroke='#ffffff'){
  if(!points.length)return;
  cmd('q');
  cmd(rgbCmd(fill));
  if(stroke){cmd(rgbCmd(stroke,true));cmd('0.8 w')}
  const first=points[0];
  cmd(`${first[0].toFixed(2)} ${(H-first[1]).toFixed(2)} m`);
  for(let i=1;i<points.length;i++){
    cmd(`${points[i][0].toFixed(2)} ${(H-points[i][1]).toFixed(2)} l`)
  }
  cmd(`h ${stroke?'B':'f'}`);
  cmd('Q')
}
function pieChart(top){
  const counts={};
  for(const m of state.members){
    for(const a of (m.activities||[])){
      const cat=displayCategory(a);
      counts[cat]=(counts[cat]||0)+1
    }
  }

  let entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,e)=>s+e[1],0);

  const availableBottom=H-48;
  const availableH=Math.max(260,availableBottom-top);

  // The chart block occupies the remaining page and is centered within it.
  const blockH=Math.min(430,availableH-4);
  const blockTop=top+Math.max(0,(availableH-blockH)/2);

  const title='Répartition des sujets par activité';
  const titleW=title.length*6.6;
  text((W-titleW)/2,blockTop,title,13.4,true,'#0a4f72');

  if(!total){
    const msg='Aucun sujet renseigné.';
    text(W/2-msg.length*2.3,blockTop+42,msg,8.8,false,'#6c7b86');
    return availableH
  }

  if(entries.length>10){
    const kept=entries.slice(0,9);
    const rest=entries.slice(9).reduce((s,e)=>s+e[1],0);
    entries=[...kept,['Autres',rest]]
  }

  const palette=['#0e5f88','#2fa66d','#d97706','#7656a8','#3c9dcc','#d9a928','#d95353','#6f8795','#35a7a0','#a16a43'];

  // Donut itself is centered on the page.
  const cx=W/2;
  const cy=blockTop+164;
  const rOuter=126;
  const rInner=61;

  function donutSector(startAng,endAng,color){
    const span=endAng-startAng;
    const steps=Math.max(6,Math.ceil(span/(Math.PI/36)));
    const pts=[];

    for(let i=0;i<=steps;i++){
      const a=startAng+span*(i/steps);
      pts.push([cx+Math.cos(a)*rOuter,cy+Math.sin(a)*rOuter])
    }
    for(let i=steps;i>=0;i--){
      const a=startAng+span*(i/steps);
      pts.push([cx+Math.cos(a)*rInner,cy+Math.sin(a)*rInner])
    }
    polygon(pts,color,'#ffffff')
  }

  let ang=-Math.PI/2;
  entries.forEach(([label,count],idx)=>{
    const span=2*Math.PI*(count/total);
    donutSector(ang,ang+span,palette[idx%palette.length]);
    ang+=span
  });

  const totalStr=String(total);
  text(cx-totalStr.length*5.1,cy-15,totalStr,20,true,'#0a4f72');
  text(cx-21,cy+11,'sujets',8.8,false,'#6c7b86');

  // Legend below the donut, visually centered in two balanced columns.
  const legendTop=cy+rOuter+24;
  const rows=Math.ceil(entries.length/2);
  const lineH=18;
  const leftCenter=W/2-118;
  const rightCenter=W/2+118;

  entries.forEach(([label,count],idx)=>{
    const col=idx<rows?0:1;
    const rowIdx=col===0?idx:idx-rows;
    const centerX=col===0?leftCenter:rightCenter;
    const yy=legendTop+rowIdx*lineH;
    const labelText=`${label} — ${count}`;
    const approxTextW=labelText.length*4.25;
    const itemW=10+7+approxTextW;
    const x=centerX-itemW/2;
    rect(x,yy,10,10,palette[idx%palette.length],null);
    text(x+17,yy-1,labelText,8.7,false,'#30424e')
  });

  return availableH
}
function beginPersonPage(member,continuation=false){
  newPage(continuation?null:`member:${member.id}`);
  reportHeader();
  text(M,y,continuation?`${member.name} — suite`:member.name,14.5,true,'#0a4f72');
  y+=26
}

/* Overview */
newPage('overview');
reportHeader();
overflowHandler=null;
text(M,y,'Vue d’ensemble',13,true,'#0a4f72');
y+=20;
const sw=[105,58,120,95,145];
row(['Intervenant','Charge','Déplacements','Congés','Remarque'],sw,true,false,null);
const loadNames=['Faible','Normale','Élevée','Très élevée'];
const loadColors=['#4b8df8','#2fa66d','#d9a928','#d95353'];
for(const m of state.members){
  row(
    [m.name,loadNames[m.load]||'Normale',m.travel||'—',m.leave||'—',m.remark||'—'],
    sw,false,false,`member:${m.id}`,
    [null,loadColors[m.load]||'#2fa66d',null,null,null]
  )
}
y+=19;
const chartH=pieChart(y);
y+=chartH+8;

/* One person starts on a fresh page */
for(const m of state.members){
  beginPersonPage(m,false);
  overflowHandler=()=>beginPersonPage(m,true);
  const groups=orderedGroups(m);
  if(!groups.length){
    text(M,y,'Aucune activité renseignée.',8.7,false,'#6c7b86');
    y+=20;

  }
  for(const g of groups){
    activitySeparator(g.label);
    for(const a of g.items){
      row([a.title,a.done||'—',a.future||'—'],[125,242,160],false,a.effort==='heavy',null)
    }
    y+=7
  }
}

/* Footer */
const total=pages.length;
for(let i=0;i<total;i++){

function buildPdfBytes(pages){
let objs=[null];
const add=body=>{objs.push(body);return objs.length-1};
const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');

const pagesId=add('');
const catalogId=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
const pageIds=pages.map(()=>add(''));
const keyToPageId={};
pages.forEach((pg,i)=>{if(pg.key)keyToPageId[pg.key]=pageIds[i]});

for(let i=0;i<pages.length;i++){
  const pg=pages[i];
  const content=pg.c.join('\n');
  const cid=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const annotIds=[];
  for(const a of (pg.a||[])){
    const dest=keyToPageId[a.targetKey];
    if(!dest)continue;
    const [x1,y1,x2,y2]=a.rect;
    annotIds.push(add(
      `<< /Type /Annot /Subtype /Link /Rect [${x1.toFixed(2)} ${y1.toFixed(2)} ${x2.toFixed(2)} ${y2.toFixed(2)}] /Border [0 0 0] /Dest [${dest} 0 R /Fit] >>`
    ))
  }
  const annots=annotIds.length?` /Annots [${annotIds.map(id=>id+' 0 R').join(' ')}]`:'';
  objs[pageIds[i]]=
    `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${cid} 0 R${annots} >>`
}
objs[pagesId]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;

let out='%PDF-1.4\n%âãÏÓ\n',offs=[0];
for(let i=1;i<objs.length;i++){
  offs[i]=out.length;
  out+=`${i} 0 obj\n${objs[i]}\nendobj\n`
}
const xref=out.length;
out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;
for(let i=1;i<objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
out+=`trailer\n<< /Size ${objs.length} /Root ${catalogId} 0 R >>\nstartxref\n${xref}\n%%EOF`;
const bytes=new Uint8Array(out.length);
for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&255;
return bytes
}
/* Export Excel multi-onglets sans dépendance externe (OOXML/ZIP). */
function xlsxEsc(v){

function xlsxCol(n){let s='';for(let x=n+1;x;x=Math.floor((x-1)/26))s=String.fromCharCode(65+(x-1)%26)+s;return s}
function xlsxSheetName(s,used){
  let base=String(s||'Intervenant').replace(/[\\\/\?\*\[\]:]/g,' ').replace(/^'+|'+$/g,'').trim().slice(0,31)||'Intervenant';
  let name=base,i=2;
  while(used.has(name.toLocaleLowerCase('fr'))){const suf=' ('+(i++)+')';name=base.slice(0,31-suf.length)+suf}
  used.add(name.toLocaleLowerCase('fr'));return name
}
function xlsxText(v,style=5){return {v:String(v??''),s:style}}

function xlsxFormula(f,cache,style=6){return {f,v:Number(cache)||0,s:style}}
function xlsxNamedRows(){
  const used=new Set();

function xlsxSheetXml(sheet){
  const cells=sheet.rows.map((entry,i)=>{

      if(raw==null)return '';

      const address=xlsxCol(j)+(i+1);
      if(x.f!=null)return `<c r="${address}" s="${x.s||0}"><f>${xlsxEsc(x.f)}</f><v>${x.v}</v></c>`;
      if(x.n)return `<c r="${address}" s="${x.s||0}"><v>${x.v}</v></c>`;
      return `<c r="${address}" s="${x.s||0}" t="inlineStr"><is><t xml:space="preserve">${xlsxEsc(x.v)}</t></is></c>`;
    }).join('');
    return `<row r="${i+1}"${entry.height?` ht="${entry.height}" customHeight="1"`:''}>${cellXml}</row>`
  }).join('');
  const columns=sheet.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
  const last=Math.max(1,sheet.rows.length);
  const merge=sheet.merges?.length?`<mergeCells count="${sheet.merges.length}">${sheet.merges.map(x=>`<mergeCell ref="${x}"/>`).join('')}</mergeCells>`:'';

    `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${xlsxCol(sheet.cols-1)}${last}"/>`+
    `<sheetViews><sheetView workbookViewId="0" showGridLines="0">${freeze}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/>`+
    `<cols>${columns}</cols><sheetData>${cells}</sheetData>${filter}${merge}<pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.3" footer="0.3"/></worksheet>`
}

function xlsxCrc(bytes){

function xlsxZip(files){

    cv.setUint32(16,crc,true);cv.setUint32(20,body.length,true);cv.setUint32(24,body.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);ch.set(name,46);

function makeReportXlsx(){
  const sheets=xlsxNamedRows();
  if(sheets.length>100)throw Error('Nombre d’onglets trop important pour l’export.');
  const base='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const pack='http://schemas.openxmlformats.org/package/2006/relationships';
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${pack}"><Relationship Id="rId1" Type="${base}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${base}"><bookViews><workbookView activeTab="0"/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${xlsxEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${pack}">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${base}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${base}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:xlsxStyles()}
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:xlsxSheetXml(s)}));
  return xlsxZip(files)
}
function downloadReportXLSX(){
  const n=state.members.reduce((sum,m)=>sum+m.activities.length,0);
  if(!n){alert('Aucune activité à exporter.');return}
  try{
    const bytes=makeReportXlsx();
    const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const start=safeDate(state.reportPeriod.start,'debut'),end=safeDate(state.reportPeriod.end,'fin');
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`Suivi AS V3R9_${start}_${end}.xlsx`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)
  }catch(e){console.error(e);alert('Impossible de générer le fichier Excel : '+e.message)}
}
